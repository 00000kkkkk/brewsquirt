[package]
name = "javasquirt"
version = "1.3.0"
edition = "2024"
rust-version = "1.85"
description = "High-performance language with JS semantics and Rust speed"
license = "Apache-2.0"
repository = "https://github.com/00000kkkkk/javasquirt"
homepage = "https://github.com/00000kkkkk/javasquirt"
readme = "README.md"
keywords = ["language", "interpreter", "javascript", "bytecode", "vm"]
categories = ["compilers", "command-line-utilities"]
exclude = [".github/", "benches/", "tests/"]

[[bin]]
name = "jsq"
path = "src/bin/jsq.rs"

[[bin]]
name = "vrotdaem"
path = "src/bin/vrotdaem.rs"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4.6", features = ["derive"] }
crc32fast = "1.4"
fancy-regex = "0.19"
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
getrandom = "0.2"
hmac = "0.12"
md-5 = "0.10"
sha1 = "0.10"
sha2 = "0.10"
indexmap = { version = "2.14", features = ["serde"] }
mimalloc = { version = "0.1", default-features = false }
num-bigint = "0.4"
num-integer = "0.1"
num-traits = "0.2"
rustc-hash = "2.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
unicode-ident = "1"
unicode-normalization = "0.1"
ureq = "3.4"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
webpki-roots = "1"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true

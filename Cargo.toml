[package]
name = "javasquirt"
version = "1.9.0"
edition = "2024"
rust-version = "1.86"
description = "High-performance language with JS semantics and Rust speed"
license = "Apache-2.0"
repository = "https://github.com/00000kkkkk/javasquirt"
homepage = "https://github.com/00000kkkkk/javasquirt"
readme = "README.md"
keywords = ["language", "interpreter", "javascript", "bytecode", "vm"]
categories = ["compilers", "command-line-utilities"]
exclude = [".github/", "benches/", "tests/"]

[[bin]]
name = "jsq"
path = "src/bin/jsq.rs"

[[bin]]
name = "vrotdaem"
path = "src/bin/vrotdaem.rs"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
chrono-tz = "0.10"
iana-time-zone = "0.1"
clap = { version = "4.6", features = ["derive"] }
crc32fast = "1.4"
fancy-regex = "0.19"
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
getrandom = "0.2"
hmac = "0.12"
md-5 = { version = "0.10", features = ["oid"] }
sha1 = { version = "0.10", features = ["oid"] }
sha2 = { version = "0.10", features = ["oid"] }
indexmap = { version = "2.14", features = ["serde"] }
mimalloc = { version = "0.1", default-features = false }
num-bigint = "0.4"
num-integer = "0.1"
num-traits = "0.2"
rustc-hash = "2.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
unicode-ident = "1"
unicode-normalization = "0.1"
ureq = { version = "3.4", default-features = false, features = ["rustls"] }
socket2 = "0.6"
libloading = "0.8"
memchr = "2"
encoding_rs = "0.8"
brotli = "8"
libsqlite3-sys = { version = "0.35", features = ["bundled"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
webpki-roots = "1"
aes = "0.8"
aes-gcm = "0.10"
cbc = { version = "0.1", features = ["std"] }
ctr = "0.9"
chacha20poly1305 = "0.10"
p256 = { version = "0.13", features = ["ecdsa", "ecdh", "pkcs8", "pem", "jwk"] }
p384 = { version = "0.13", features = ["ecdsa", "ecdh", "pkcs8", "pem", "jwk"] }
ed25519-dalek = { version = "2", features = ["pkcs8", "pem", "rand_core"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
rsa = { version = "0.9", features = ["sha2", "pem", "hazmat"] }
pkcs8 = { version = "0.10", features = ["pem", "std", "encryption"] }
pem-rfc7468 = { version = "0.7", features = ["alloc"] }
spki = { version = "0.7", features = ["pem", "std"] }
rand_core = { version = "0.6", features = ["getrandom"] }
scrypt = { version = "0.11", default-features = false }
wasmi = { version = "0.47.1", default-features = false, features = ["std", "simd"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  create-release:
    name: create-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/create-gh-release-action@v1
        with:
          changelog: CHANGELOG.md
          title: BrewSquirt $tag
          token: ${{ secrets.GITHUB_TOKEN }}

  upload-assets:
    name: upload-assets (${{ matrix.target }})
    needs: create-release
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: taiki-e/install-action@v2
        if: contains(matrix.target, '-linux-')
        with:
          tool: cross
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about
      - name: Collect third-party licenses
        run: cargo about generate about.hbs -o THIRD_PARTY_LICENSES
      - uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: jsq,vrotdaem
          target: ${{ matrix.target }}
          build-tool: ${{ contains(matrix.target, '-linux-') && 'cross' || 'cargo' }}
          archive: brewsquirt-$tag-$target
          include: LICENSE,NOTICE,THIRD_PARTY_LICENSES,README.md,CHANGELOG.md
          tar: unix
          zip: windows
          checksum: sha256
          locked: true
          token: ${{ secrets.GITHUB_TOKEN }}

  manifests:
    name: manifests
    needs: upload-assets
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: Update the Scoop manifest and the Homebrew formula
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: sh scripts/update-manifests.sh "${{ github.ref_name }}"
      - uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}
          branch: chore/manifests-${{ github.ref_name }}
          commit-message: "chore: bump install manifests to ${{ github.ref_name }}"
          title: "chore: bump install manifests to ${{ github.ref_name }}"
          body: "Scoop manifest and Homebrew formula regenerated from the ${{ github.ref_name }} release checksums."
          labels: no-changelog
          delete-branch: true

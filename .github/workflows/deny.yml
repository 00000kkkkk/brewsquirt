name: Deny

on:
  push:
    branches: [main]
    paths:
      - Cargo.toml
      - Cargo.lock
      - deny.toml
      - about.toml
      - about.hbs
      - .github/workflows/deny.yml
  pull_request:
    paths:
      - Cargo.toml
      - Cargo.lock
      - deny.toml
      - about.toml
      - about.hbs
      - .github/workflows/deny.yml
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  cargo-deny:
    name: cargo-deny (${{ matrix.checks }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        checks:
          - advisories
          - bans licenses sources
    continue-on-error: ${{ matrix.checks == 'advisories' && github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check ${{ matrix.checks }}

  third-party-licenses:
    name: third-party licenses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about
      - name: Collect third-party licenses
        run: cargo about generate about.hbs -o THIRD_PARTY_LICENSES
      - name: Check the listing
        run: |
          test "$(grep -c '^Used by:' THIRD_PARTY_LICENSES)" -gt 50
          if grep -q '&quot;' THIRD_PARTY_LICENSES; then exit 1; fi
